# App containers for an AWS EC2 deployment. Use the local override to add LocalStack.
#
#   docker compose up --build
#
# AWS credentials come from the EC2 instance role. App secrets and resource
# names are read from .env in the project root.

services:
  ui:
    build:
      context: ./UI
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - ingestion-api
      - summarization-api

  # ── ingestion ──────────────────────────────────────────────────────────
  ingestion-api:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    environment: &aws-env
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      JOBS_TABLE: ${JOBS_TABLE:-videosense-jobs}
      JOBS_BUCKET: ${JOBS_BUCKET:-videosense-jobs}
      JOBS_QUEUE: ${JOBS_QUEUE:-videosense-jobs}
      TRANSCRIBE_QUEUE: ${TRANSCRIBE_QUEUE:-videosense-transcribe}
      SUMMARIZE_QUEUE: ${SUMMARIZE_QUEUE:-videosense-summarize}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_STT_MODEL: ${SARVAM_STT_MODEL:-saaras:v3}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8001:8001"

  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    command: python -m services.ingestion.worker
    environment: *aws-env

  # ── transcription ──────────────────────────────────────────────────────
  transcription-worker:
    build:
      context: .
      dockerfile: Dockerfile.transcription
    environment:
      <<: *aws-env
      # CPU inference keeps the deployment on a basic x86 instance.
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_CACHE_DIR: /models
    volumes:
      - whisper-cache:/models

  # ── summarization ──────────────────────────────────────────────────────
  summarization-api:
    build:
      context: .
      dockerfile: Dockerfile.summarization
    environment:
      <<: *aws-env
      CHROMA_DIR: /data/chroma
      CHROMA_MODE: persistent
    ports:
      - "8002:8002"
    volumes:
      - chroma-data:/data/chroma

  summarization-worker:
    build:
      context: .
      dockerfile: Dockerfile.summarization
    command: python -m services.summarization.worker
    environment:
      <<: *aws-env
      CHROMA_DIR: /data/chroma
      CHROMA_MODE: persistent
    volumes:
      - chroma-data:/data/chroma

volumes:
  whisper-cache:
  chroma-data:
