server {
    listen 80;
    server_name _;
    client_max_body_size 500m;

    location = /api/upload {
        proxy_pass http://ingestion-api:8001;
        proxy_read_timeout 3600s;
    }

    location = /api/process {
        proxy_pass http://ingestion-api:8001;
    }

    location ~ ^/api/process/[^/]+/(status|results|ask)$ {
        proxy_pass http://summarization-api:8002;
    }

    location /api/ {
        proxy_pass http://summarization-api:8002;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
